<!DOCTYPE html>
<html lang="eng">
    <head>
        <title>Projects</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <img id="background" src="artnanims/aquarium_nofish.gif">
        <div id="page-overlay"></div>


        <main class="ui-window">

            <p class="page-title">SELECT A LEVEL</p>
            <p id="text">
              Select a level below to learn about the associated project.
            </p>

            <section class="level-interface">

                <div class="level-screen">
                    <img class="level-bg" src="artnanims/title_page_bg.png" alt="">

                    <div class="project-name" id="projectName">PORTFOLIO WEBSITE</div>

                    <div class="level-path">

                        <div class="path left"></div>

                        <div class="path right"></div>

                    </div>

                    <div class="level-slots">
                        <div class="level-slot current level1" id="leftSlot">
                            <img class="level-animal" src="artnanims/clownfish.png">

                            <div class="level-dot"></div>

                            <div class="level-label" id="level1">LEVEL 1</div>
                        </div>
                        <div class="level-slot level2" id="centerSlot">
                            <img class="level-animal" src="artnanims/crab.png">

                            <div class="level-dot"></div>

                            <div class="level-label">LEVEL 2</div>
                        </div>
                        <div class="level-slot level3" id="rightSlot">
                            <img class="level-animal" src="artnanims/turtle-silhouette.png">

                            <div class="level-dot"></div>

                            <div class="level-label">LEVEL 3</div>
                        </div>
                    </div>
                </div>

                <div class="level-controls" >
                    <button id="prevBtn">&lt;</button>
                    <button id="selectBtn">SELECT</button>
                
                    <button id="nextBtn">&gt;</button>
                </div>
                

            </section>
            
            <div class="buttons">
                <a href="aboutme.html" style="font-size: 50px;">BACK</a>
            </div>

        </main>
    
        <script src="script.js"></script>
        
    </body>
</html>
